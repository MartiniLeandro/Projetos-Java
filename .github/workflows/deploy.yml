name: Build and Push GraalVM Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'gmassessoria/**'
      - '.github/workflows/deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Adicionar Memória Swap (Para o GraalVM não explodir)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Login no Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da Imagem Docker
        run: |
          # Aponta para o caminho onde está o seu Dockerfile dentro do repositório
          docker build --no-cache -t martinileandro/gmassessoria-api:latest ./gmassessoria/demo

      - name: Enviar Imagem para o Docker Hub
        run: |
          docker push martinileandro/gmassessoria-api:latest